<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sakthivel S - cinematic developer portfolio with interactive terminal, scroll-driven project storytelling, and Three.js visuals."
    />
    <title>Sakthivel S | Cinematic Developer Portfolio</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          var systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
